<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Email confirmed — PL8 PEEK</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #0A0A0A;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  main { max-width: 400px; }
  .brand {
    display: inline-block;
    border: 2.5px solid #FFFFFF;
    border-radius: 12px;
    padding: 10px 22px;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 1px;
  }
  .tagline { font-size: 11px; letter-spacing: 2px; color: #9A9A9A; font-weight: 700; margin: 12px 0 40px; }
  .check {
    width: 56px; height: 56px;
    border: 3px solid #FFFFFF;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 26px;
  }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  p { color: #9A9A9A; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <div class="brand">PL8 &bull; PEEK</div>
  <div class="tagline">PEEK MORE. KNOW MORE.</div>
  <div class="check">&#10003;</div>
  <h1>You're all set</h1>
  <p>Your email is confirmed. Return to the PL8 PEEK app and sign in.</p>
</main>
</body>
</html>
