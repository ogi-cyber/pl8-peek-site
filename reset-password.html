<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset your password — PL8 PEEK</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #0A0A0A;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 400px; }
  .brand {
    display: inline-block;
    border: 2.5px solid #FFFFFF;
    border-radius: 12px;
    padding: 10px 22px;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 1px;
  }
  .tagline { font-size: 11px; letter-spacing: 2px; color: #9A9A9A; font-weight: 700; margin: 12px 0 40px; }
  h1 { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #9A9A9A; margin-bottom: 16px; }
  input {
    width: 100%;
    background: #141414;
    border: 2px solid #2A2A2A;
    border-radius: 14px;
    color: #FFFFFF;
    font-size: 16px;
    padding: 14px;
    margin-bottom: 12px;
    outline: none;
  }
  input:focus { border-color: #FFFFFF; }
  button {
    width: 100%;
    background: #FFFFFF;
    color: #0A0A0A;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 800;
    padding: 16px;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg { margin-top: 16px; font-size: 14px; line-height: 1.5; }
  .msg.error { color: #FF453A; }
  .msg.success { color: #FFFFFF; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div class="brand">PL8 &bull; PEEK</div>
  <div class="tagline">PEEK MORE. KNOW MORE.</div>

  <div id="form-section" class="hidden">
    <h1>Choose a new password</h1>
    <input id="password" type="password" placeholder="New password" autocomplete="new-password" />
    <input id="confirm" type="password" placeholder="Confirm new password" autocomplete="new-password" />
    <button id="submit">Set New Password</button>
  </div>

  <div id="status" class="msg">Checking your reset link&hellip;</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  var client = window.supabase.createClient(
    "https://jrqimifeftclexoqhfwa.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpycWltaWZlZnRjbGV4b3FoZndhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NTUxNDMsImV4cCI6MjEwMDMzMTE0M30.YYnowJmDePiAnOuftQvcPuLh2SpWqPca74-tf-UNGBY"
  );

  var statusEl = document.getElementById("status");
  var formEl = document.getElementById("form-section");
  var submitBtn = document.getElementById("submit");

  function showError(t) { statusEl.textContent = t; statusEl.className = "msg error"; }
  function showReady() { formEl.classList.remove("hidden"); statusEl.textContent = ""; statusEl.className = "msg"; }

  var checked = false;
  function checkSession() {
    if (checked) return;
    checked = true;
    client.auth.getSession().then(function (res) {
      if (res.data.session) showReady();
      else showError("This reset link is invalid or has expired. Request a new one from the PL8 PEEK app.");
    });
  }
  client.auth.onAuthStateChange(function (event) {
    if (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") { checked = true; showReady(); }
  });
  setTimeout(checkSession, 1500);

  submitBtn.addEventListener("click", function () {
    var password = document.getElementById("password").value;
    var confirm = document.getElementById("confirm").value;
    if (password.length < 6) { showError("Password must be at least 6 characters."); return; }
    if (password !== confirm) { showError("Passwords don't match."); return; }
    submitBtn.disabled = true;
    statusEl.textContent = "";
    client.auth.updateUser({ password: password }).then(function (res) {
      if (res.error) { showError(res.error.message); submitBtn.disabled = false; }
      else {
        formEl.classList.add("hidden");
        statusEl.textContent = "Password updated. Return to the PL8 PEEK app and sign in with your new password.";
        statusEl.className = "msg success";
        client.auth.signOut();
      }
    });
  });
</script>
</body>
</html>
